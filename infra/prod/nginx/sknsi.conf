# /etc/nginx/sites-available/sknsi.conf
# Symlink to sites-enabled, then: nginx -t && systemctl reload nginx
#
# Layout:
#   /                       -> static site (Hostinger or /var/www/sknsi)
#   /annotate.html          -> static info page
#   /annotate, /annotate/*  -> reverse proxy to Label Studio container

upstream labelstudio_upstream {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sknsi.com www.sknsi.com;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sknsi.com www.sknsi.com;

    ssl_certificate     /etc/letsencrypt/live/sknsi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sknsi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static site root
    root /var/www/sknsi;
    index index.html;

    client_max_body_size 250M;  # large image uploads

    # Static files (landing + annotate.html + images)
    location / {
        try_files $uri $uri/ =404;
    }

    # Annotation portal — Label Studio served under /annotate via
    # Django FORCE_SCRIPT_NAME=/annotate. All LS URLs (HTML, /annotate/static,
    # /annotate/api, /annotate/ws) live under this prefix.
    location /annotate {
        proxy_pass http://labelstudio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Prefix /annotate;
        proxy_set_header Script-Name       /annotate;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # block dotfiles
    location ~ /\. { deny all; }
}
