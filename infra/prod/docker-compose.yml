services:
  postgres:
    image: postgres:16-alpine
    container_name: sknsi-ls-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sknsi-net

  labelstudio:
    image: heartexlabs/label-studio:latest
    container_name: sknsi-ls-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback-only — firewalled from public, reached by host nginx.
      - "127.0.0.1:8080:8080"
    environment:
      DJANGO_DB: default
      POSTGRE_NAME: ${POSTGRES_DB}
      POSTGRE_USER: ${POSTGRES_USER}
      POSTGRE_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRE_PORT: "5432"
      POSTGRE_HOST: postgres

      LABEL_STUDIO_HOST: ${LABEL_STUDIO_HOST}
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD}

      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
      LABEL_STUDIO_USE_ENFORCE_CSRF_CHECKS: "true"
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}

      # Serve LS under /annotate URL prefix. Django FORCE_SCRIPT_NAME
      # rewrites all generated URLs (templates, static, API) with the prefix,
      # so a single nginx `location /annotate` covers everything.
      FORCE_SCRIPT_NAME: /annotate
      STATIC_URL: /annotate/static/
    volumes:
      - ls_data:/label-studio/data
    networks:
      - sknsi-net

volumes:
  pgdata:
  ls_data:

networks:
  sknsi-net:
    driver: bridge
