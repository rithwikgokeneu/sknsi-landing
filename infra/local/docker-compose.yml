services:
  postgres:
    image: postgres:16-alpine
    container_name: sknsi-ls-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labelstudio}
      POSTGRES_USER: ${POSTGRES_USER:-labelstudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labelstudio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  labelstudio:
    image: heartexlabs/label-studio:latest
    container_name: sknsi-ls-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DJANGO_DB: default
      POSTGRE_NAME: ${POSTGRES_DB:-labelstudio}
      POSTGRE_USER: ${POSTGRES_USER:-labelstudio}
      POSTGRE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRE_PORT: "5432"
      POSTGRE_HOST: postgres
      LABEL_STUDIO_HOST: ${LABEL_STUDIO_HOST:-http://localhost:8080}
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME:-admin@sknsi.com}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD:-changeme-strong}
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
    volumes:
      - ls_data:/label-studio/data

volumes:
  pgdata:
  ls_data:
